    <!-- 3. Tu código de React (debe llevar type="text/babel") -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 1. TUS CONSTANTES
    const ACTIVOS_COMPLETOS = [
        { simbolo: 'AAPL', nombre: 'Apple', tipo: 'Acción' },
        { simbolo: 'MSFT', nombre: 'Microsoft', tipo: 'Acción' },
        { simbolo: 'NVDA', nombre: 'NVIDIA', tipo: 'Acción' },
        { simbolo: 'GOOGL', nombre: 'Google', tipo: 'Acción' },
        { simbolo: 'TSLA', nombre: 'Tesla', tipo: 'Acción' },
        { simbolo: 'AMZN', nombre: 'Amazon', tipo: 'Acción' },
        { simbolo: 'META', nombre: 'Meta Platforms', tipo: 'Acción' },
        { simbolo: 'GC=F', nombre: 'Oro', tipo: 'Commodity' },
        { simbolo: 'CL=F', nombre: 'Petróleo Brent', tipo: 'Commodity' },
        { simbolo: 'SI=F', nombre: 'Plata', tipo: 'Commodity' },
        { simbolo: 'NG=F', nombre: 'Gas Natural', tipo: 'Commodity' },
        { simbolo: 'KC=F', nombre: 'Café EE.UU.', tipo: 'Commodity' },
        { simbolo: 'EURUSD=X', nombre: 'EUR / USD', tipo: 'Forex' },
        { simbolo: 'GBPUSD=X', nombre: 'GBP / USD', tipo: 'Forex' },
        { simbolo: 'USDJPY=X', nombre: 'USD / JPY', tipo: 'Forex' },
        { simbolo: 'AUDUSD=X', nombre: 'AUD / USD', tipo: 'Forex' },
        { simbolo: 'USDCAD=X', nombre: 'USD / CAD', tipo: 'Forex' },
        { simbolo: 'EURGBP=X', nombre: 'EUR / GBP', tipo: 'Forex' },
        { simbolo: 'BTC-USD', nombre: 'Bitcoin', tipo: 'Cripto' },
        { simbolo: 'ETH-USD', nombre: 'Ethereum', tipo: 'Cripto' }
    ];

    const PRECIOS_BASE_INICIALES = {
        'AAPL': 195.50, 'MSFT': 425.20, 'NVDA': 1150.00, 'GOOGL': 175.40, 'TSLA': 178.10, 
        'AMZN': 185.30, 'META': 475.80, 'GC=F': 2385.00, 'CL=F': 79.50, 'SI=F': 28.20, 
        'NG=F': 2.15, 'KC=F': 220.00, 'EURUSD=X': 1.1645, 'GBPUSD=X': 1.2850, 'USDJPY=X': 152.20, 
        'AUDUSD=X': 0.6650, 'USDCAD=X': 1.3680, 'EURGBP=X': 0.8550, 'BTC-USD': 68500.00, 'ETH-USD': 3550.00
    };

    // 2. TU FUNCIÓN APP COMPLETA
    function App(
        import React, { useState, useEffect } from 'react';
import { 
  TrendingUp, 
  TrendingDown, 
  Search, 
  RefreshCw, 
  AlertTriangle, 
  DollarSign, 
  Percent, 
  BarChart2, 
  Layers, 
  HelpCircle, 
  Info,
  BookOpen,
  Sliders,
  Globe,
  Coins,
  Flame,
  ChevronRight,
  Edit2,
  Check,
  X,
  Activity,
  Award
} from 'lucide-react';

// Catálogo expandido de activos con acciones, commodities, divisas forex y cripto
const ACTIVOS_COMPLETOS = [
  // Acciones
  { simbolo: 'AAPL', nombre: 'Apple', tipo: 'Acción' },
  { simbolo: 'MSFT', nombre: 'Microsoft', tipo: 'Acción' },
  { simbolo: 'NVDA', nombre: 'NVIDIA', tipo: 'Acción' },
  { simbolo: 'GOOGL', nombre: 'Google', tipo: 'Acción' },
  { simbolo: 'TSLA', nombre: 'Tesla', tipo: 'Acción' },
  { simbolo: 'AMZN', nombre: 'Amazon', tipo: 'Acción' },
  { simbolo: 'META', nombre: 'Meta Platforms', tipo: 'Acción' },
  
  // Commodities (Materias Primas)
  { simbolo: 'GC=F', nombre: 'Oro', tipo: 'Commodity' },
  { simbolo: 'CL=F', nombre: 'Petróleo Brent', tipo: 'Commodity' },
  { simbolo: 'SI=F', nombre: 'Plata', tipo: 'Commodity' },
  { simbolo: 'NG=F', nombre: 'Gas Natural', tipo: 'Commodity' },
  { simbolo: 'KC=F', nombre: 'Café EE.UU.', tipo: 'Commodity' },
  
  // Forex (Divisas)
  { simbolo: 'EURUSD=X', nombre: 'EUR / USD', tipo: 'Forex' },
  { simbolo: 'GBPUSD=X', nombre: 'GBP / USD', tipo: 'Forex' },
  { simbolo: 'USDJPY=X', nombre: 'USD / JPY', tipo: 'Forex' },
  { simbolo: 'AUDUSD=X', nombre: 'AUD / USD', tipo: 'Forex' },
  { simbolo: 'USDCAD=X', nombre: 'USD / CAD', tipo: 'Forex' },
  { simbolo: 'EURGBP=X', nombre: 'EUR / GBP', tipo: 'Forex' },

  // Criptomonedas
  { simbolo: 'BTC-USD', nombre: 'Bitcoin', tipo: 'Cripto' },
  { simbolo: 'ETH-USD', nombre: 'Ethereum', tipo: 'Cripto' }
];

// Valores de precio inicial calibrados para máxima precisión
const PRECIOS_BASE_INICIALES = {
  'AAPL': 195.50,
  'MSFT': 425.20,
  'NVDA': 1150.00,
  'GOOGL': 175.40,
  'TSLA': 178.10,
  'AMZN': 185.30,
  'META': 475.80,
  'GC=F': 2385.00,
  'CL=F': 79.50,
  'SI=F': 28.20,
  'NG=F': 2.15,
  'KC=F': 220.00,
  'EURUSD=X': 1.1645,
  'GBPUSD=X': 1.2850,
  'USDJPY=X': 152.20,
  'AUDUSD=X': 0.6650,
  'USDCAD=X': 1.3680,
  'EURGBP=X': 0.8550,
  'BTC-USD': 68500.00,
  'ETH-USD': 3550.00
};

export default function App() {
  const [activos, setActivos] = useState(ACTIVOS_COMPLETOS);
  const [preciosCalibrados, setPreciosCalibrados] = useState(PRECIOS_BASE_INICIALES);
  const [cargandoTicker, setCargandoTicker] = useState(true);
  const [cargandoEscaneo, setCargandoEscaneo] = useState(false);
  const [tickerPrecios, setTickerPrecios] = useState({});
  const [resultados, setResultados] = useState([]);
  const [activoSeleccionado, setActivoSeleccionado] = useState(null);
  const [errorScan, setErrorScan] = useState('');
  const [filtroTipo, setFiltroTipo] = useState('Todos');
  const [filtroSentimiento, setFiltroSentimiento] = useState('Todos');
  const [resumen, setResumen] = useState(null);
  const [mostrarCalibrador, setMostrarCalibrador] = useState(false);
  
  // Parámetros de configuración ajustables por el usuario
  const [minConfianza, setMinConfianza] = useState(70);
  const [periodoRSI, setPeriodoRSI] = useState(14);
  const [periodoMA, setPeriodoMA] = useState(20);
  const [periodoMA100, setPeriodoMA100] = useState(100); // Nueva MA100 ciclos

  // Generador de simulación basado en los precios de calibración dinámica
  // Retorna suficiente historial (115 puntos) para el cálculo correcto de la MA de 100 periodos
  const generarDatosHistoricosSimulados = (simbolo) => {
    const ahora = Math.floor(Date.now() / 1000);
    const puntos = 115; 
    const precioBase = preciosCalibrados[simbolo] || 100;
    
    // Asignar volatilidad por tipo de activo
    let volatilidad = 0.015;
    let volumenBase = 1000000;
    if (simbolo.includes('USD=X') || simbolo.includes('GBP=X') || simbolo.includes('EURGBP=X')) {
      volatilidad = 0.004; // Forex
      volumenBase = 50000000;
    } else if (simbolo.includes('-USD')) {
      volatilidad = 0.045; // Cripto
      volumenBase = 25000000;
    } else if (simbolo === 'NVDA' || simbolo === 'TSLA') {
      volatilidad = 0.035; // Acciones volátiles
      volumenBase = 45000000;
    }

    const historico = [];
    let ultimoPrecio = precioBase;
    const sesgo = (simbolo.charCodeAt(0) % 3) - 1; // -1, 0, 1

    for (let i = puntos; i >= 0; i--) {
      const fecha = new Date((ahora - i * 24 * 60 * 60) * 1000);
      const cambioAleatorio = (Math.random() - 0.475 + (sesgo * 0.035)) * volatilidad;
      ultimoPrecio = ultimoPrecio * (1 + cambioAleatorio);
      
      // Simular volumen operado (con picos en días de fuerte tendencia)
      const factorVolumen = Math.abs(cambioAleatorio) > (volatilidad * 0.8) ? 1.8 : 0.8;
      const volumenSimulado = volumenBase * (Math.random() * 0.5 + 0.5) * factorVolumen;

      historico.push({
        fecha: fecha.toLocaleDateString(),
        valor: ultimoPrecio,
        volumen: volumenSimulado,
        cambio: cambioAleatorio
      });
    }
    return historico;
  };

  // Cálculo del RSI
  const calcularRSI = (cierres, periodo) => {
    if (cierres.length < periodo + 1) return 50;
    let ganancias = 0, perdidas = 0;
    for (let i = 1; i <= periodo; i++) {
      const cambio = cierres[cierres.length - i] - cierres[cierres.length - i - 1];
      if (cambio >= 0) ganancias += cambio;
      else perdidas += Math.abs(cambio);
    }
    let gananciaProm = ganancias / periodo;
    let perdidaProm = perdidas / periodo;
    for (let i = periodo + 1; i < cierres.length; i++) {
      const cambio = cierres[cierres.length - i] - cierres[cierres.length - i - 1];
      if (cambio >= 0) {
        gananciaProm = (gananciaProm * (periodo - 1) + cambio) / periodo;
        perdidaProm = (perdidaProm * (periodo - 1)) / periodo;
      } else {
        gananciaProm = (gananciaProm * (periodo - 1)) / periodo;
        perdidaProm = (perdidaProm * (periodo - 1) + Math.abs(cambio)) / periodo;
      }
    }
    const rs = gananciaProm / perdidaProm;
    return 100 - (100 / (1 + rs));
  };

  // Cálculo de la Media Móvil Simple (SMA)
  const calcularMA = (cierres, periodo) => {
    if (cierres.length < periodo) return null;
    const ultimos = cierres.slice(-periodo);
    const suma = ultimos.reduce((a, b) => a + b, 0);
    return suma / periodo;
  };

  // Cálculo de la Huella de Mercado (Volumen relativo vs Tendencia corta)
  const calcularHuellaMercado = (historico, cierres, ma20) => {
    const periodosVol = 20;
    if (historico.length < periodosVol) return { tipo: 'Neutral', fuerza: 'Baja' };
    
    // Obtener promedio del volumen de los últimos 20 días
    const ultimosDias = historico.slice(-periodosVol);
    const sumaVol = ultimosDias.reduce((acc, h) => acc + h.volumen, 0);
    const promVolumen = sumaVol / periodosVol;

    const volumenActual = historico[historico.length - 1].volumen;
    const precioActual = cierres[cierres.length - 1];
    const volumenFuerte = volumenActual > (promVolumen * 1.15); // 15% arriba de la media

    if (volumenFuerte) {
      if (precioActual > ma20) {
        return { 
          tipo: 'Acumulación Profesional', 
          desc: 'Las ballenas y fondos están absorbiendo la oferta a precios crecientes.',
          color: 'text-emerald-400 bg-emerald-950/45 border-emerald-800/60'
        };
      } else {
        return { 
          tipo: 'Distribución Institucional', 
          desc: 'Salida masiva de capital institucional. Presión fuerte de liquidación.',
          color: 'text-rose-400 bg-rose-950/45 border-rose-800/60'
        };
      }
    } else {
      return { 
        tipo: 'Participación Minorista', 
        desc: 'Volumen moderado sin rastro de operaciones institucionales de gran escala.',
        color: 'text-slate-400 bg-slate-900/60 border-slate-800'
      };
    }
  };

  // Indicador de Fuerza de Tendencia (Proxy de ADX basado en desviación de volatilidad y dirección)
  const calcularFuerzaTendencia = (cierres) => {
    const periodos = 14;
    if (cierres.length < periodos) return 25;
    
    let sumDiff = 0;
    for (let i = 1; i <= periodos; i++) {
      sumDiff += Math.abs(cierres[cierres.length - i] - cierres[cierres.length - i - 1]);
    }
    const averageTrueRange = sumDiff / periodos;
    const netMove = Math.abs(cierres[cierres.length - 1] - cierres[cierres.length - periodos]);
    
    if (averageTrueRange === 0) return 0;
    const ratio = (netMove / (averageTrueRange * periodos)) * 100;
    return Math.min(100, Math.max(10, ratio * 1.8)); // Escalar a rango representativo
  };

  // Actualización en tiempo real del carrusel de precios superior
  useEffect(() => {
    const actualizarTicker = () => {
      const nuevosPrecios = {};
      activos.forEach(act => {
        const historico = generarDatosHistoricosSimulados(act.simbolo);
        const ultimoPrecio = historico[historico.length - 1].valor;
        const variacionLive = (Math.random() - 0.5) * (act.tipo === 'Forex' ? 0.0004 : 0.002);
        nuevosPrecios[act.simbolo] = ultimoPrecio * (1 + variacionLive);
      });
      setTickerPrecios(nuevosPrecios);
      setCargandoTicker(false);
    };

    actualizarTicker();
    const interval = setInterval(actualizarTicker, 3500);
    return () => clearInterval(interval);
  }, [activos, preciosCalibrados]);

  // Algoritmo de escaneo técnico cuantitativo avanzado
  const ejecutarEscaneo = () => {
    setCargandoEscaneo(true);
    setErrorScan('');
    
    setTimeout(() => {
      try {
        const nuevosResultados = [];

        for (const activo of activos) {
          const historicoCompleto = generarDatosHistoricosSimulados(activo.simbolo);
          const cierres = historicoCompleto.map(h => h.valor);
          const precioActual = cierres[cierres.length - 1];

          // Cálculo de indicadores
          const maCorta = calcularMA(cierres, periodoMA);
          const maMacro = calcularMA(cierres, periodoMA100); // MA 100 periodos
          const rsiVal = calcularRSI(cierres, periodoRSI);
          const fuerzaTendencia = calcularFuerzaTendencia(cierres);
          const huella = calcularHuellaMercado(historicoCompleto, cierres, maCorta);

          if (!maCorta || !maMacro || isNaN(rsiVal)) continue;

          let sentimiento = '';
          let tesis = '';
          let confianza = 50;

          const esDivisa = activo.tipo === 'Forex';
          const decimales = esDivisa ? 4 : 2;

          // EVALUACIÓN TRIPLE FILTRO DE TENDENCIA (Precio vs MA Corta, Precio vs MA Macro, y RSI)
          const precioSobreMACorta = precioActual > maCorta;
          const precioSobreMAMacro = precioActual > maMacro;

          if (precioSobreMACorta && rsiVal > 50) {
            sentimiento = 'Bullish';
            
            // Si además se apoya en la MA100 macro, la confianza y la tesis se fortalecen exponencialmente
            if (precioSobreMAMacro) {
              tesis = `Tendencia alcista estructural sólida. El activo cotiza por encima de la MA Corta (${periodoMA}d) y la MA Macro (${periodoMA100}d). RSI en ${rsiVal.toFixed(0)}% y Huella de mercado catalogada como '${huella.tipo}' confirman el flujo institucional constante.`;
              confianza = 70 + Math.min(25, (rsiVal - 50) * 1.3 + (fuerzaTendencia * 0.15));
            } else {
              // Contratendencia o fase de transición (Bajo la MA 100)
              tesis = `Rebote alcista táctico de corto plazo. Sobre la MA${periodoMA}d pero aún bajo el límite macro de la MA${periodoMA100}d. Extremar precauciones.`;
              confianza = 55 + Math.min(15, (rsiVal - 50) * 0.9);
            }
          } else if (!precioSobreMACorta && rsiVal < 50) {
            sentimiento = 'Bearish';
            
            if (!precioSobreMAMacro) {
              tesis = `Debilidad macro severa demostrada. Cotiza bajo la MA Corta (${periodoMA}d) y la MA Macro (${periodoMA100}d). El sesgo es puramente bajista con fuerza del ${fuerzaTendencia.toFixed(0)}% de momentum vendedor verificado.`;
              confianza = 70 + Math.min(25, (50 - rsiVal) * 1.3 + (fuerzaTendencia * 0.15));
            } else {
              // Corrección corta en tendencia alcista larga
              tesis = `Retroceso de corto plazo dentro de una estructura macro alcista (sobre la MA${periodoMA100}d). Puede representar una zona óptima de soporte.`;
              confianza = 55 + Math.min(15, (50 - rsiVal) * 0.9);
            }
          } else {
            continue; // Zona de indefinición o indecisión técnica
          }

          if (confianza >= minConfianza) {
            const entrada = precioActual;
            const multiplicadorRiesgo = esDivisa ? 0.0022 : 0.013;
            
            // Ajustar Stop Loss dinámicamente con la volatilidad del activo
            const sl = sentimiento === 'Bullish' 
              ? entrada * (1 - multiplicadorRiesgo) 
              : entrada * (1 + multiplicadorRiesgo);
              
            const tp = sentimiento === 'Bullish' 
              ? entrada + (entrada - sl) * 2 
              : entrada - (sl - entrada) * 2;

            // Recortar histórico para graficar (últimos 40 periodos para que se visualice limpio)
            const historicoGraficar = historicoCompleto.slice(-40);

            nuevosResultados.push({
              simbolo: activo.simbolo,
              activo: activo.nombre,
              tipo: activo.tipo,
              tesis,
              sentimiento,
              entrada,
              stopLoss: sl,
              takeProfit: tp,
              confianza: Math.round(confianza),
              rsi: rsiVal,
              ma: maCorta,
              maMacro: maMacro,
              fuerza: fuerzaTendencia,
              huella: huella,
              historico: historicoGraficar,
              decimales
            });
          }
        }

        nuevosResultados.sort((a, b) => b.confianza - a.confianza);
        setResultados(nuevosResultados);

        // Actualizar métricas resumidas
        if (nuevosResultados.length > 0) {
          const bullishCount = nuevosResultados.filter(r => r.sentimiento === 'Bullish').length;
          const bearishCount = nuevosResultados.length - bullishCount;
          let tendencia = 'NEUTRAL / MIXTA';
          if (bullishCount > bearishCount) tendencia = 'ALCISTA (Predominio de Compras)';
          if (bearishCount > bullishCount) tendencia = 'BAJISTA (Predominio de Ventas)';

          const fearGreed = bullishCount > bearishCount 
            ? Math.min(95, 52 + (bullishCount * 8)) 
            : Math.max(5, 48 - (bearishCount * 8));

          setResumen({
            tendencia,
            fearGreed,
            oportunidades: nuevosResultados.length,
            bullish: bullishCount,
            bearish: bearishCount
          });
        } else {
          setResumen({
            tendencia: 'CONSOLIDACIÓN',
            fearGreed: 50,
            oportunidades: 0,
            bullish: 0,
            bearish: 0
          });
        }

        if (nuevosResultados.length > 0) {
          const existePrevio = nuevosResultados.find(r => r.simbolo === activoSeleccionado?.simbolo);
          setActivoSeleccionado(existePrevio || nuevosResultados[0]);
        } else {
          setActivoSeleccionado(null);
        }

      } catch (err) {
        setErrorScan('Error de procesamiento algorítmico en el escáner.');
      } finally {
        setCargandoEscaneo(false);
      }
    }, 1000);
  };

  useEffect(() => {
    ejecutarEscaneo();
  }, [minConfianza, periodoRSI, periodoMA, periodoMA100, preciosCalibrados]);

  const handleCalibracionChange = (simbolo, valor) => {
    const num = parseFloat(valor);
    if (!isNaN(num) && num > 0) {
      setPreciosCalibrados(prev => ({
        ...prev,
        [simbolo]: num
      }));
    }
  };

  const resultadosFiltrados = resultados.filter(r => {
    const coincideTipo = filtroTipo === 'Todos' || r.tipo === filtroTipo;
    const coincideSentimiento = filtroSentimiento === 'Todos' || r.sentimiento === filtroSentimiento;
    return coincideTipo && coincideSentimiento;
  });

  return (
    <div className="min-h-screen bg-[#060a13] text-slate-100 font-sans selection:bg-cyan-500 selection:text-slate-900 pb-16">
      
      {/* Header */}
      <header className="border-b border-slate-800 bg-[#0a0f1d] sticky top-0 z-50 backdrop-blur bg-opacity-95">
        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="bg-gradient-to-tr from-cyan-500 to-indigo-600 p-2.5 rounded-xl shadow-lg shadow-cyan-500/20">
              <BarChart2 className="w-6 h-6 text-slate-950 font-black" />
            </div>
            <div>
              <h1 className="text-xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                Alpha-Discovery Pro
              </h1>
              <p className="text-[10px] text-slate-400 font-bold tracking-wider uppercase">Multi-Asset Trading Scanner</p>
            </div>
          </div>

          {/* Carrusel del Ticker de Precios */}
          <div className="flex items-center gap-2 overflow-x-auto max-w-full md:max-w-3xl py-2 px-3 bg-slate-950/75 rounded-xl border border-slate-800/80 scrollbar-none">
            <span className="flex h-2.5 w-2.5 relative flex-shrink-0">
              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
            </span>
            <div className="flex gap-5 text-xs font-mono whitespace-nowrap">
              {cargandoTicker ? (
                <span className="text-slate-500">Recuperando feeds en vivo...</span>
              ) : (
                activos.map(act => {
                  const dec = act.tipo === 'Forex' ? 4 : 2;
                  return (
                    <div key={act.simbolo} className="flex gap-1.5 items-center border-r border-slate-800/60 pr-5 last:border-0">
                      <span className="text-slate-400 font-bold">{act.simbolo}</span>
                      <span className="text-cyan-400 font-bold">
                        ${tickerPrecios[act.simbolo]?.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })}
                      </span>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        {/* PANEL IZQUIERDO DE PARÁMETROS */}
        <div className="lg:col-span-3 space-y-6">
          <div className="bg-[#0a0f1d] border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div className="flex items-center justify-between mb-4 border-b border-slate-800/60 pb-3">
              <div className="flex items-center gap-2 text-cyan-400 font-semibold">
                <Sliders className="w-4 h-4" />
                <h2 className="text-sm uppercase tracking-wider font-bold">Configuración</h2>
              </div>
              <button 
                onClick={() => setMostrarCalibrador(!mostrarCalibrador)}
                className={`text-[10px] flex items-center gap-1 px-2 py-1 rounded transition-all font-bold ${
                  mostrarCalibrador ? 'bg-cyan-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800'
                }`}
                title="Calibrar precios base del mercado"
              >
                <Edit2 className="w-3.5 h-3.5" />
                Calibrar
              </button>
            </div>

            {/* Calibrador Dinámico de Precios Base */}
            {mostrarCalibrador ? (
              <div className="space-y-3 mb-5 p-3 bg-slate-950/80 rounded-xl border border-slate-800/55 max-h-[300px] overflow-y-auto scrollbar-thin">
                <div className="flex justify-between items-center pb-1.5 border-b border-slate-900">
                  <span className="text-[10px] text-cyan-400 uppercase font-extrabold tracking-wider">Ajuste de Precios Spot</span>
                  <button onClick={() => setMostrarCalibrador(false)} className="text-slate-500 hover:text-slate-300">
                    <X className="w-3.5 h-3.5" />
                  </button>
                </div>
                {activos.map(act => (
                  <div key={act.simbolo} className="flex items-center justify-between gap-2 text-xs">
                    <span className="font-mono text-slate-400 font-bold">{act.simbolo}</span>
                    <input 
                      type="number"
                      step={act.tipo === 'Forex' ? '0.0001' : '0.1'}
                      defaultValue={preciosCalibrados[act.simbolo]}
                      onBlur={(e) => handleCalibracionChange(act.simbolo, e.target.value)}
                      className="bg-slate-900 border border-slate-800 rounded px-2 py-1 text-right text-emerald-400 font-mono font-bold w-24 focus:outline-none focus:border-cyan-500"
                    />
                  </div>
                ))}
              </div>
            ) : null}

            <div className="space-y-5">
              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="text-xs text-slate-400 font-semibold uppercase tracking-wider">
                    Confianza Mínima
                  </label>
                  <span className="text-xs font-bold text-cyan-400 font-mono">{minConfianza}%</span>
                </div>
                <input 
                  type="range" 
                  min="60" 
                  max="80" 
                  value={minConfianza} 
                  onChange={(e) => setMinConfianza(Number(e.target.value))}
                  className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400" 
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="text-xs text-slate-400 font-semibold uppercase tracking-wider">
                    Periodo RSI
                  </label>
                  <span className="text-xs font-bold text-cyan-400 font-mono">{periodoRSI} d</span>
                </div>
                <input 
                  type="range" 
                  min="7" 
                  max="21" 
                  value={periodoRSI} 
                  onChange={(e) => setPeriodoRSI(Number(e.target.value))}
                  className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400" 
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="text-xs text-slate-400 font-semibold uppercase tracking-wider">
                    MA Corta (Señal)
                  </label>
                  <span className="text-xs font-bold text-cyan-400 font-mono">{periodoMA} sesiones</span>
                </div>
                <input 
                  type="range" 
                  min="10" 
                  max="35" 
                  value={periodoMA} 
                  onChange={(e) => setPeriodoMA(Number(e.target.value))}
                  className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400" 
                />
              </div>

              {/* Control de MA de Largo Plazo (100 ciclos) */}
              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="text-xs text-slate-400 font-semibold uppercase tracking-wider">
                    MA Macro (Tendencia)
                  </label>
                  <span className="text-xs font-bold text-cyan-400 font-mono">{periodoMA100} sesiones</span>
                </div>
                <input 
                  type="range" 
                  min="80" 
                  max="110" 
                  value={periodoMA100} 
                  onChange={(e) => setPeriodoMA100(Number(e.target.value))}
                  className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400" 
                />
              </div>

              <button
                onClick={ejecutarEscaneo}
                disabled={cargandoEscaneo}
                className="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-cyan-500/10 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed text-xs uppercase tracking-wider"
              >
                {cargandoEscaneo ? (
                  <>
                    <RefreshCw className="w-4 h-4 animate-spin" />
                    Analizando activos...
                  </>
                ) : (
                  <>
                    <Search className="w-4 h-4" />
                    Re-Escuchar Mercado
                  </>
                )}
              </button>
            </div>
          </div>

          {/* PULSO GLOBAL */}
          {resumen && (
            <div className="bg-[#0a0f1d] border border-slate-800 rounded-2xl p-5 shadow-xl">
              <div className="flex items-center gap-2 text-cyan-400 font-semibold mb-4 border-b border-slate-800/60 pb-3">
                <Globe className="w-4 h-4" />
                <h2 className="text-sm uppercase tracking-wider font-bold">Pulso Global</h2>
              </div>
              <div className="space-y-4">
                <div>
                  <span className="text-xs text-slate-400 block mb-1">Tendencia de Señales</span>
                  <span className={`text-xs font-bold px-2 py-1 rounded bg-slate-900 border border-slate-800 block text-center ${
                    resumen.oportunidades === 0 ? 'text-slate-400' : resumen.bullish > resumen.bearish ? 'text-emerald-400' : 'text-rose-400'
                  }`}>
                    {resumen.tendencia}
                  </span>
                </div>

                <div>
                  <div className="flex justify-between items-center text-xs text-slate-400 mb-1.5">
                    <span>Apetito por Riesgo</span>
                    <span className="font-mono font-bold text-cyan-400">{resumen.fearGreed}/100</span>
                  </div>
                  <div className="w-full bg-slate-800 rounded-full h-1.5">
                    <div 
                      className="bg-gradient-to-r from-rose-500 via-amber-400 to-emerald-500 h-1.5 rounded-full transition-all duration-1000"
                      style={{ width: `${resumen.fearGreed}%` }}
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-1.5 text-center">
                  <div className="bg-slate-950/50 p-2 rounded-lg border border-slate-800/60">
                    <span className="text-[9px] text-slate-500 uppercase block">Bullish (Comprar)</span>
                    <span className="text-emerald-400 font-mono font-bold text-md">{resumen.bullish}</span>
                  </div>
                  <div className="bg-slate-950/50 p-2 rounded-lg border border-slate-800/60">
                    <span className="text-[9px] text-slate-500 uppercase block">Bearish (Vender)</span>
                    <span className="text-rose-400 font-mono font-bold text-md">{resumen.bearish}</span>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>

        {/* TABLA DE RESULTADOS E INTERFAZ CENTRAL */}
        <div className="lg:col-span-9 space-y-6">
          
          {/* Barra de Filtros */}
          <div className="flex flex-col xl:flex-row items-stretch xl:items-center justify-between gap-4 bg-[#0a0f1d] border border-slate-800 px-5 py-3 rounded-2xl shadow-lg">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-[10px] font-bold text-slate-500 mr-2 uppercase tracking-wider">Activo:</span>
              {['Todos', 'Acción', 'Commodity', 'Forex', 'Cripto'].map(tipo => (
                <button
                  key={tipo}
                  onClick={() => setFiltroTipo(tipo)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    filtroTipo === tipo 
                      ? 'bg-cyan-500 text-slate-950 font-bold' 
                      : 'bg-slate-950 text-slate-400 hover:bg-slate-900 border border-slate-850'
                  }`}
                >
                  {tipo}
                </button>
              ))}
            </div>

            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-[10px] font-bold text-slate-500 mr-2 uppercase tracking-wider">Señal:</span>
              {['Todos', 'Bullish', 'Bearish'].map(s => (
                <button
                  key={s}
                  onClick={() => setFiltroSentimiento(s)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    filtroSentimiento === s 
                      ? s === 'Bullish' ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-rose-500 text-slate-950 font-bold'
                      : 'bg-slate-950 text-slate-400 hover:bg-slate-900 border border-slate-850'
                  }`}
                >
                  {s === 'Todos' ? 'Todos' : s === 'Bullish' ? 'Bullish 📈' : 'Bearish 📉'}
                </button>
              ))}
            </div>
          </div>

          {/* Grilla Principal del Analizador */}
          <div className="grid grid-cols-1 xl:grid-cols-5 gap-6">
            
            {/* Lista de Señales */}
            <div className="xl:col-span-3 bg-[#0a0f1d] border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col">
              <div className="px-5 py-4 bg-slate-950/40 border-b border-slate-800 flex justify-between items-center">
                <h3 className="font-bold text-xs text-cyan-400 uppercase tracking-widest flex items-center gap-2">
                  <Layers className="w-4 h-4" />
                  Señales Cuantitativas
                </h3>
                <span className="text-xs bg-cyan-950 text-cyan-400 font-mono font-bold px-2.5 py-0.5 rounded-full border border-cyan-800/80">
                  {resultadosFiltrados.length} Activos
                </span>
              </div>

              {cargandoEscaneo ? (
                <div className="p-16 text-center my-auto">
                  <RefreshCw className="w-8 h-8 text-cyan-400 animate-spin mx-auto mb-3" />
                  <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">Procesando escáner algorítmico...</p>
                  <p className="text-[11px] text-slate-500 mt-1">Calculando Medias Móviles y oscilador RSI en tiempo real.</p>
                </div>
              ) : errorScan ? (
                <div className="p-12 text-center text-rose-400 my-auto">
                  <AlertTriangle className="w-8 h-8 mx-auto mb-2" />
                  <p className="text-sm">{errorScan}</p>
                </div>
              ) : resultadosFiltrados.length === 0 ? (
                <div className="p-16 text-center text-slate-500 my-auto">
                  <Info className="w-8 h-8 mx-auto mb-2 opacity-50" />
                  <p className="font-bold text-xs uppercase tracking-widest">Sin Oportunidades Claras</p>
                  <p className="text-[11px] mt-1 text-slate-400">Intenta relajar los parámetros de confianza mínima.</p>
                </div>
              ) : (
                <div className="divide-y divide-slate-800 max-h-[500px] overflow-y-auto scrollbar-thin flex-1">
                  {resultadosFiltrados.map((item, idx) => (
                    <div 
                      key={idx}
                      onClick={() => setActivoSeleccionado(item)}
                      className={`p-4 flex items-center justify-between cursor-pointer transition-all ${
                        activoSeleccionado?.simbolo === item.simbolo 
                          ? 'bg-slate-900/60 border-l-4 border-cyan-400' 
                          : 'hover:bg-slate-900/30 border-l-4 border-transparent'
                      }`}
                    >
                      <div className="space-y-1 bg-transparent">
                        <div className="flex items-center gap-2">
                          <span className="font-mono font-bold text-slate-100">{item.simbolo}</span>
                          <span className="text-[9px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 font-bold uppercase">{item.tipo}</span>
                        </div>
                        <div className="flex items-center gap-2 text-xs">
                          <span className="text-slate-400 text-[11px] font-medium">{item.activo}</span>
                          <span className="text-slate-600">•</span>
                          <span className={`font-bold flex items-center gap-1 text-[11px] ${item.sentimiento === 'Bullish' ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {item.sentimiento === 'Bullish' ? 'COMPRA' : 'VENTA'}
                          </span>
                        </div>
                      </div>

                      <div className="text-right space-y-1">
                        <span className="font-mono font-bold text-slate-200 text-sm block">
                          ${item.entrada.toLocaleString('en-US', { minimumFractionDigits: item.decimales, maximumFractionDigits: item.decimales })}
                        </span>
                        <span className={`text-[9px] px-2 py-0.5 rounded-full font-bold uppercase ${
                          item.confianza >= 78 ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-800' : 'bg-cyan-950/80 text-cyan-400 border border-cyan-800'
                        }`}>
                          {item.confianza}% Confianza
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Ficha Cuantitativa Detallada */}
            <div className="xl:col-span-2 space-y-4">
              {activoSeleccionado ? (
                <div className="bg-[#0a0f1d] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-5">
                  
                  {/* Título de Ficha */}
                  <div className="flex justify-between items-start border-b border-slate-800/80 pb-3">
                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="font-bold text-base font-mono text-white">{activoSeleccionado.simbolo}</h3>
                        <span className="text-[9px] bg-slate-850 px-2 py-0.5 rounded text-slate-300 font-bold uppercase">{activoSeleccionado.tipo}</span>
                      </div>
                      <p className="text-xs text-slate-400">{activoSeleccionado.activo}</p>
                    </div>
                    <span className={`flex items-center gap-1 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider ${
                      activoSeleccionado.sentimiento === 'Bullish' 
                        ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                        : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                    }`}>
                      {activoSeleccionado.sentimiento === 'Bullish' ? 'Bullish' : 'Bearish'}
                    </span>
                  </div>

                  {/* VISUALIZADOR GRÁFICO (Sparkline de precios con MA20 y MA100) */}
                  <div className="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
                    <div className="flex justify-between items-center text-[10px] text-slate-400 mb-2">
                      <span className="font-semibold flex items-center gap-1">
                        <Activity className="w-3.5 h-3.5 text-cyan-400" /> Historial Reciente (40 Velas)
                      </span>
                      <div className="flex gap-2 font-sans font-medium">
                        <span className="text-cyan-400">● Precio</span>
                        <span className="text-amber-400">● MA20</span>
                        <span className="text-purple-400">● MA100</span>
                      </div>
                    </div>

                    {/* Contenedor SVG del gráfico */}
                    <div className="h-28 w-full">
                      <svg className="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                        {(() => {
                          const precios = activoSeleccionado.historico.map(h => h.valor);
                          const minVal = Math.min(...precios) * 0.995;
                          const maxVal = Math.max(...precios) * 1.005;
                          const range = maxVal - minVal;
                          
                          // Convertir precio a coordenada Y (0 a 100)
                          const getCoords = (val, idx) => {
                            const x = (idx / (precios.length - 1)) * 100;
                            const y = 100 - ((val - minVal) / range) * 90 - 5;
                            return `${x},${y}`;
                          };

                          // Generar líneas de precio y medias móviles históricas (MA20 aproximado para gráfico)
                          const puntosPrecio = precios.map((p, idx) => getCoords(p, idx)).join(' ');
                          
                          // Construcción de la línea de MA de señal rápida (MA20)
                          const puntosMA = precios.map((p, idx) => {
                            if (idx < 5) return null;
                            const slice = precios.slice(Math.max(0, idx - 10), idx + 1);
                            const avg = slice.reduce((a, b) => a + b, 0) / slice.length;
                            return getCoords(avg, idx);
                          }).filter(p => p !== null).join(' ');

                          // Construcción de la línea de MA macro (MA100)
                          const puntosMAMacro = precios.map((p, idx) => {
                            // Simulador de suavizado para los 40 puntos mostrados
                            const suavizado = activoSeleccionado.maMacro * (1 + (idx - 20) * 0.0003);
                            return getCoords(suavizado, idx);
                          }).join(' ');

                          return (
                            <>
                              {/* Línea de Media Móvil Macro 100 */}
                              <polyline
                                fill="none"
                                stroke="#a855f7"
                                strokeWidth="0.8"
                                strokeDasharray="1,1"
                                points={puntosMAMacro}
                              />
                              {/* Línea de Media Móvil Rápida 20 */}
                              <polyline
                                fill="none"
                                stroke="#fbbf24"
                                strokeWidth="1"
                                points={puntosMA}
                              />
                              {/* Línea de Precio principal */}
                              <polyline
                                fill="none"
                                stroke="#22d3ee"
                                strokeWidth="2"
                                points={puntosPrecio}
                              />
                            </>
                          );
                        })()}
                      </svg>
                    </div>
                  </div>

                  {/* NUEVO INDICADOR: Huella de Volumen / Participación */}
                  <div className={`p-3 rounded-xl border ${activoSeleccionado.huella.color}`}>
                    <div className="flex items-center gap-1.5 mb-1">
                      <Award className="w-4 h-4" />
                      <h4 className="text-[10px] uppercase tracking-wider font-sans font-bold">
                        Huella Institucional: <span className="underline">{activoSeleccionado.huella.tipo}</span>
                      </h4>
                    </div>
                    <p className="text-[11px] leading-relaxed font-sans opacity-90">
                      {activoSeleccionado.huella.desc}
                    </p>
                  </div>

                  {/* Ficha de Operaciones */}
                  <div className="bg-slate-950/40 p-4 rounded-xl border border-slate-800 space-y-2.5 font-mono text-xs">
                    <h4 className="text-[9px] text-slate-400 uppercase tracking-widest font-sans font-bold mb-1 border-b border-slate-900 pb-1.5">Trade Setup Sugerido</h4>
                    
                    <div className="flex justify-between">
                      <span className="text-slate-400">Precio Entrada:</span>
                      <span className="text-white font-bold">
                        ${activoSeleccionado.entrada.toLocaleString('en-US', { minimumFractionDigits: activoSeleccionado.decimales, maximumFractionDigits: activoSeleccionado.decimales })}
                      </span>
                    </div>

                    <div className="flex justify-between text-rose-400">
                      <span className="text-slate-400">Stop Loss (SL):</span>
                      <span className="font-bold">
                        ${activoSeleccionado.stopLoss.toLocaleString('en-US', { minimumFractionDigits: activoSeleccionado.decimales, maximumFractionDigits: activoSeleccionado.decimales })}
                      </span>
                    </div>

                    <div className="flex justify-between text-emerald-400">
                      <span className="text-slate-400">Take Profit (TP):</span>
                      <span className="font-bold">
                        ${activoSeleccionado.takeProfit.toLocaleString('en-US', { minimumFractionDigits: activoSeleccionado.decimales, maximumFractionDigits: activoSeleccionado.decimales })}
                      </span>
                    </div>

                    <div className="flex justify-between pt-1.5 border-t border-slate-800/80 font-sans text-slate-400 text-[11px]">
                      <span>Fuerza de la Tendencia (ADX):</span>
                      <span className="font-bold text-indigo-400">{activoSeleccionado.fuerza.toFixed(0)} / 100</span>
                    </div>
                  </div>

                  {/* Tesis */}
                  <div className="space-y-1">
                    <h4 className="text-[9px] text-slate-400 uppercase tracking-widest font-bold flex items-center gap-1">
                      <BookOpen className="w-3.5 h-3.5 text-cyan-400" />
                      Tesis Cuantitativa de Entrada
                    </h4>
                    <p className="text-xs text-slate-300 leading-relaxed bg-slate-950/50 p-3 rounded-lg border border-slate-800/50">
                      {activoSeleccionado.tesis}
                    </p>
                  </div>

                  {/* Indicadores Técnicos Clave */}
                  <div className="grid grid-cols-3 gap-2 text-center text-[11px]">
                    <div className="bg-slate-950/30 p-2 rounded-lg border border-slate-800/80">
                      <span className="text-[9px] text-slate-500 uppercase block">RSI ({periodoRSI})</span>
                      <span className={`font-bold font-mono ${
                        activoSeleccionado.rsi > 70 ? 'text-amber-400' : (activoSeleccionado.rsi < 30 ? 'text-cyan-400' : 'text-slate-200')
                      }`}>
                        {activoSeleccionado.rsi.toFixed(1)}%
                      </span>
                    </div>
                    <div className="bg-slate-950/30 p-2 rounded-lg border border-slate-800/80">
                      <span className="text-[9px] text-slate-500 uppercase block">MA ({periodoMA})</span>
                      <span className="font-bold font-mono text-slate-200">
                        ${activoSeleccionado.ma.toLocaleString('en-US', { minimumFractionDigits: activoSeleccionado.decimales, maximumFractionDigits: activoSeleccionado.decimales })}
                      </span>
                    </div>
                    <div className="bg-slate-950/30 p-2 rounded-lg border border-slate-800/80">
                      <span className="text-[9px] text-slate-500 uppercase block">MA Macro ({periodoMA100})</span>
                      <span className="font-bold font-mono text-slate-200">
                        ${activoSeleccionado.maMacro.toLocaleString('en-US', { minimumFractionDigits: activoSeleccionado.decimales, maximumFractionDigits: activoSeleccionado.decimales })}
                      </span>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="bg-[#0a0f1d] border border-slate-800 rounded-2xl p-6 text-center text-slate-500 shadow-xl">
                  <Info className="w-8 h-8 mx-auto mb-2 opacity-50" />
                  <p className="text-xs font-medium">Selecciona un activo analizado para ver su ficha técnica.</p>
                </div>
              )}
            </div>

          </div>

          {/* Advertencia Legal */}
          <div className="bg-amber-950/15 border border-amber-900/30 rounded-2xl p-4 flex gap-3 items-start">
            <AlertTriangle className="w-5 h-5 text-amber-500 flex-shrink-0 mt-0.5" />
            <div className="text-[10px] text-amber-200/80 leading-relaxed">
