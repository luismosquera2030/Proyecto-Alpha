<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Alpha</title>

    <!-- 1. Cargar React y Babel desde CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 2. Cargar Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Aquí se renderizará tu app de React -->
    <div id="root"></div>

    <!-- 3. Tu código de React (debe llevar type="text/babel") -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Pega aquí tus constantes (ACTIVOS_COMPLETOS, PRECIOS_BASE_INICIALES, etc.)
        const ACTIVOS_COMPLETOS = [
            { simbolo: 'AAPL', nombre: 'Apple', tipo: 'Acción' },
            { simbolo: 'MSFT', nombre: 'Microsoft', tipo: 'Acción' }
            // ... resto de tus activos
        ];

        function App() {
            // Pega aquí toda la lógica de tu función App()
            return (
                <div class="p-5">
                    <h1 class="text-2xl font-bold">Proyecto Alpha Cargado Correctamente</h1>
                </div>
            );
        }

        // Renderizar la aplicación en el DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
