<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Alpha - Escáner de Mercado</title>
    
    <!-- 1. Cargar React y ReactDOM (Versión de producción para estabilidad) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 2. Cargar Babel para transformar JSX directamente en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 3. Cargar Tailwind CSS para los estilos visuales -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            750: '#20293A', // Un tono intermedio para hover
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Contenedor principal donde React montará la app -->
    <div id="root">
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-slate-400">Cargando Proyecto Alpha...</p>
            </div>
        </div>
    </div>

    <!-- 4. Tu código JavaScript/React (Importante: type="text/babel") -->
    <script type="text/babel">
        // Desestructuramos los hooks que necesitamos de la librería React global
        const { useState, useEffect } = React;

        // --- CONSTANTES DE DATOS ---
        const ACTIVOS_COMPLETOS = [
            { simbolo: 'AAPL', nombre: 'Apple', tipo: 'Acción' },
            { simbolo: 'MSFT', nombre: 'Microsoft', tipo: 'Acción' },
            { simbolo: 'NVDA', nombre: 'NVIDIA', tipo: 'Acción' },
            { simbolo: 'GOOGL', nombre: 'Google', tipo: 'Acción' },
            { simbolo: 'TSLA', nombre: 'Tesla', tipo: 'Acción' },
            { simbolo: 'AMZN', nombre: 'Amazon', tipo: 'Acción' },
            { simbolo: 'META', nombre: 'Meta Platforms', tipo: 'Acción' },
            { simbolo: 'GC=F', nombre: 'Oro', tipo: 'Commodity' },
            { simbolo: 'CL=F', nombre: 'Petróleo Brent', tipo: 'Commodity' },
            { simbolo: 'SI=F', nombre: 'Plata', tipo: 'Commodity' },
            { simbolo: 'NG=F', nombre: 'Gas Natural', tipo: 'Commodity' },
            { simbolo: 'KC=F', nombre: 'Café EE.UU.', tipo: 'Commodity' },
            { simbolo: 'EURUSD=X', nombre: 'EUR / USD', tipo: 'Forex' },
            { simbolo: 'GBPUSD=X', nombre: 'GBP / USD', tipo: 'Forex' },
            { simbolo: 'USDJPY=X', nombre: 'USD / JPY', tipo: 'Forex' },
            { simbolo: 'AUDUSD=X', nombre: 'AUD / USD', tipo: 'Forex' },
            { simbolo: 'USDCAD=X', nombre: 'USD / CAD', tipo: 'Forex' },
            { simbolo: 'EURGBP=X', nombre: 'EUR / GBP', tipo: 'Forex' },
            { simbolo: 'BTC-USD', nombre: 'Bitcoin', tipo: 'Cripto' },
            { simbolo: 'ETH-USD', nombre: 'Ethereum', tipo: 'Cripto' }
        ];

        // Precios de referencia para la simulación
        const PRECIOS_BASE_INICIALES = {
            'AAPL': 195.50, 'MSFT': 425.20, 'NVDA': 1150.00, 'GOOGL': 175.40, 'TSLA': 178.10,
            'AMZN': 185.30, 'META': 475.80, 'GC=F': 2385.00, 'CL=F': 79.50, 'SI=F': 28.20,
            'NG=F': 2.15, 'KC=F': 220.00, 'EURUSD=X': 1.1645, 'GBPUSD=X': 1.2850, 'USDJPY=X': 152.20,
            'AUDUSD=X': 0.6650, 'USDCAD=X': 1.3680, 'EURGBP=X': 0.8550, 'BTC-USD': 68500.00, 'ETH-USD': 3550.00
        };

        // --- FUNCIONES DE LÓGICA ---

        // Simula datos históricos para calcular indicadores
        function generarDatosHistoricosSimulados(simbolo) {
            let puntos = 115; // Suficientes para un RSI de 14 períodos
            let precioBase = PRECIOS_BASE_INICIALES[simbolo] || 100;
            let historico = [];
            let ultimoPrecio = precioBase;

            for (let i = puntos; i >= 0; i--) {
                // Variación aleatoria entre -1% y +1%
                let cambioAleatorio = (Math.random() - 0.49) * 0.02;
                ultimoPrecio = ultimoPrecio * (1 + cambioAleatorio);
                historico.push({
                    fecha: new Date(Date.now() - i * 86400000).toLocaleDateString(),
                    valor: ultimoPrecio
                });
            }
            return historico;
        }

        // Calcula el Índice de Fuerza Relativa (RSI) simple
        function calcularRSI(cierres, periodo = 14) {
            if (cierres.length < periodo + 1) return 50;
            
            let ganancias = 0;
            let perdidas = 0;

            // Primer cálculo: promedio simple de ganancias/pérdidas
            for (let i = 1; i <= periodo; i++) {
                let cambio = cierres[i].valor - cierres[i - 1].valor;
                if (cambio >= 0) ganancias += cambio;
                else perdidas += Math.abs(cambio);
            }

            let gananciaProm = ganancias / periodo;
            let perdidaProm = perdidas / periodo;

            if (perdidaProm === 0) return 100;

            // Fuerza Relativa (RS)
            let rs = gananciaProm / perdidaProm;
            
            // RSI final (redondeado)
            return Math.round(100 - (100 / (1 + rs)));
        }

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            // Estados para gestionar los datos y la interfaz
            const [filtroTipo, setFiltroTipo] = useState('Todos');
            const [busqueda, setBusqueda] = useState('');
            const [resultados, setResultados] = useState([]);
            const [cargando, setCargando] = useState(true);

            // Efecto que se ejecuta al cargar para "escanear" el mercado
            useEffect(() => {
                const escanearMercado = () => {
                    setCargando(true);
                    // Simulamos un pequeño retraso de red
                    setTimeout(() => {
                        const analisis = ACTIVOS_COMPLETOS.map(activo => {
                            const historico = generarDatosHistoricosSimulados(activo.simbolo);
                            const rsi = calcularRSI(historico);
                            const ultimoPrecio = historico[historico.length - 1].valor;
                            
                            // Determinamos sentimiento básico según RSI
                            let sentimiento = 'Neutral';
                            if (rsi > 65) sentimiento = 'Alcista';
                            else if (rsi < 35) sentimiento = 'Bajista';

                            return {
                                ...activo,
                                precio: ultimoPrecio.toFixed(2),
                                rsi: rsi,
                                sentimiento: sentimiento
                            };
                        });
                        setResultados(analisis);
                        setCargando(false);
                    }, 800);
                };

                escanearMercado();
            }, []); // Ejecutar solo una vez al montar

            // Lógica de filtrado combinado (Tipo + Búsqueda)
            const activosFiltrados = resultados.filter(item => {
                const coincideTipo = filtroTipo === 'Todos' || item.tipo === filtroTipo;
                const coincideBusqueda = busqueda === '' || 
                                         item.nombre.toLowerCase().includes(busqueda.toLowerCase()) || 
                                         item.simbolo.toLowerCase().includes(busqueda.toLowerCase());
                return coincideTipo && coincideBusqueda;
            });

            // Función auxiliar para obtener estilos del badge de sentimiento
            const getSentimientoBadge = (sentimiento) => {
                const baseClass = "px-2.5 py-1 rounded-full text-xs font-semibold border";
                if (sentimiento === 'Alcista') {
                    return `${baseClass} bg-emerald-950 text-emerald-300 border-emerald-700`;
                } else if (sentimiento === 'Bajista') {
                    return `${baseClass} bg-rose-950 text-rose-300 border-rose-700`;
                }
                return `${baseClass} bg-amber-950 text-amber-300 border-amber-700`;
            };

            // Iconos simples en SVG para evitar dependencias externas
            const IconSearch = () => (
                <svg className="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            );

            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto">
                    {/* Encabezado Principal */}
                    <header className="mb-10 border-b border-slate-800 pb-6">
                        <div className="flex items-center justify-between gap-4 flex-wrap">
                            <div>
                                <h1 className="text-4xl font-extrabold text-blue-400 tracking-tight">Proyecto Alpha</h1>
                                <p className="text-slate-400 text-lg mt-1">Escáner de Mercado y Análisis Técnico en Tiempo Real</p>
                            </div>
                            <div className="flex items-center gap-2 px-4 py-2 bg-slate-800 rounded-lg border border-slate-700">
                                <div className={`h-2.5 w-2.5 rounded-full ${cargando ? 'bg-amber-500 animate-pulse' : 'bg-emerald-500'}`}></div>
                                <span className="text-sm font-medium text-slate-300">
                                    {cargando ? 'Escaneando...' : 'Mercado En Vivo'}
                                </span>
                            </div>
                        </div>
                    </header>

                    {/* Barra de Controles (Búsqueda y Filtros) */}
                    <div className="flex flex-col md:flex-row gap-4 mb-8 p-5 bg-slate-800/50 rounded-xl border border-slate-700 shadow-inner">
                        <div className="relative flex-grow">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <IconSearch />
                            </div>
                            <input 
                                type="text" 
                                placeholder="Buscar por símbolo o nombre (ej. AAPL, Bitcoin)..." 
                                className="bg-slate-900 border border-slate-700 text-white rounded-lg pl-10 pr-4 py-2.5 w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                value={busqueda}
                                onChange={(e) => setBusqueda(e.target.value)}
                            />
                        </div>
                        <div className="flex items-center gap-2 overflow-x-auto pb-2 md:pb-0 no-scrollbar">
                            <span className="text-sm text-slate-400 mr-2 hidden md:inline">Filtrar:</span>
                            {['Todos', 'Acción', 'Commodity', 'Forex', 'Cripto'].map(tipo => (
                                <button 
                                    key={tipo}
                                    onClick={() => setFiltroTipo(tipo)}
                                    className={`px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition flex-shrink-0 ${
                                        filtroTipo === tipo 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'bg-slate-700 text-slate-200 hover:bg-slate-600 border border-slate-600'
                                    }`}
                                >
                                    {tipo}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Tabla de Resultados o Estado de Carga */}
                    {cargando ? (
                        <div className="text-center py-20 bg-slate-800 rounded-xl border border-slate-700">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mx-auto mb-4"></div>
                            <p className="text-slate-400">Analizando activos...</p>
                        </div>
                    ) : activosFiltrados.length > 0 ? (
                        <div className="overflow-x-auto bg-slate-800 rounded-xl shadow-xl border border-slate-700">
                            <table className="w-full text-left text-sm text-slate-300">
                                <thead className="bg-slate-950/60 text-slate-400 uppercase text-xs tracking-wider">
                                    <tr>
                                        <th className="px-6 py-4">Símbolo</th>
                                        <th className="px-6 py-4">Nombre Completo</th>
                                        <th className="px-6 py-4">Categoría</th>
                                        <th className="px-6 py-4 text-right">Precio Sim.</th>
                                        <th className="px-6 py-4 text-center">RSI (14)</th>
                                        <th className="px-6 py-4 text-center">Sentimiento</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
                                    {activosFiltrados.map((item) => (
                                        <tr key={item.simbolo} className="hover:bg-slate-750/50 transition-colors">
                                            <td className="px-6 py-4 font-bold text-white tracking-tight">{item.simbolo}</td>
                                            <td className="px-6 py-4 text-slate-200">{item.nombre}</td>
                                            <td className="px-6 py-4">
                                                <span className="px-2.5 py-1 bg-slate-700 text-slate-300 rounded text-xs font-medium border border-slate-600">
                                                    {item.tipo}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4 text-right font-mono text-white text-base">
                                                ${item.precio}
                                            </td>
                                            <td className={`px-6 py-4 text-center font-mono font-bold text-lg ${
                                                item.rsi > 70 ? 'text-rose-400' : item.rsi < 30 ? 'text-emerald-400' : 'text-amber-400'
                                            }`}>
                                                {item.rsi}
                                            </td>
                                            <td className="px-6 py-4 text-center">
                                                <span className={getSentimientoBadge(item.sentimiento)}>
                                                    {item.sentimiento}
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    ) : (
                        <div className="text-center py-16 bg-slate-800 rounded-xl border border-slate-700">
                            <IconSearch />
                            <p className="text-slate-400 mt-4 text-lg">No se encontraron activos para "<span className="text-white font-medium">{busqueda}</span>" en la categoría {filtroTipo}.</p>
                            <button 
                                onClick={() => { setBusqueda(''); setFiltroTipo('Todos'); }}
                                className="mt-6 px-5 py-2.5 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-500 transition"
                            >
                                Restablecer búsqueda
                            </button>
                        </div>
                    )}

                    {/* Pie de página simple */}
                    <footer className="mt-16 pt-8 border-t border-slate-800 text-center text-slate-600 text-xs">
                        <p>Proyecto Alpha © 2024 - Datos simulados con fines demostrativos.</p>
                        <p className="mt-1">Desarrollado con React, Tailwind CSS y Babel Standalone.</p>
                    </footer>
                </div>
            );
        }

        // --- RENDERIZADO FINAL ---
        // Obtenemos el nodo del DOM y creamos la raíz de React
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        // Renderizamos nuestra aplicación
        root.render(<App />);
    </script>
</body>
</html>
